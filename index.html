
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

      body {
    margin: 0;
    padding: 0;
    background: white;
    color: black;
    font-family: "Times New Roman", Times, serif;
    text-align: center;
    overflow-x: hidden;
        }

        /* Navigation */
        nav {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 18px 10px;
            background: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            color: blue;
        }

        /* Main content */
        section {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 15px;
            text-align: center;
        }

        /* All images */
        img {
            display: block;
            max-width: 100%;
            width: auto;
            height: auto;
            margin: 25px auto;
        }

        /* Logo */
        .logo {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 90px;
            max-width: 25vw;
            height: auto;
            z-index: 2000;
        }

        /* Large artwork */
        .wide-image {
            width: 100%;
            max-width: 1300px;
        }

        .medium-image {
            width: 100%;
            max-width: 500px;
        }

        .small-image {
            width: 100%;
            max-width: 250px;
        }

        /* Text */
        p {
            max-width: 700px;
            margin: 35px auto;
            padding: 0 15px;
            text-align: center;
            line-height: 1.7;
            font-size: 17px;
        }

        /* Video */
        video {
            display: block;
            width: 100%;
            max-width: 800px;
            height: auto;
            margin: 40px auto;
        }

        /* Audio */
        audio {
            display: block;
            width: calc(100% - 30px);
            max-width: 600px;
            margin: 40px auto;
        }

        /* Extra spacing on larger screens */
        @media (min-width: 768px) {
            section {
                padding: 80px 30px;
            }

            nav {
                gap: 70px;
            }

            nav a {
                font-size: 20px;
            }

            .logo {
                width: 150px;
                top: 20px;
                left: 20px;
            }

            p {
                font-size: 20px;
            }
        }
    </style>
</head>
